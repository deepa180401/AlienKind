<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The डिज़AIन Square</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Raleway:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: centered mobile link column, tilted photo + sticker, poster name, hard-shadow buttons, theme switcher */
:root{
  --bg:#0b0b0c; --fg:#ffffff; --muted:#b9b6bd; --lead:#ff1fb8; --pop:#e6f200; --on-lead:#ffffff; --tag:#e6f200; --tag-fg:#0b0b0c;
  --g1:rgba(255,31,184,.45); --g2:rgba(230,242,0,.18);
  --display:"Teko","Impact","Arial Narrow",sans-serif; --body:"Raleway",system-ui,sans-serif;
  color-scheme:dark;
}
[data-skin="lime"]{--lead:#e6f200;--pop:#ff1fb8;--on-lead:#0b0b0c;--tag:#ff1fb8;--tag-fg:#fff;--g1:rgba(230,242,0,.35);--g2:rgba(255,31,184,.18)}
[data-skin="volt"]{--bg:#e6f200;--fg:#0b0b0c;--muted:#3a3d00;--lead:#0b0b0c;--pop:#ff1fb8;--on-lead:#fff;--tag:#0b0b0c;--tag-fg:#e6f200;--g1:rgba(255,255,255,.35);--g2:transparent;color-scheme:light}
[data-skin="blue"]{--lead:#5258ff;--pop:#e6f200;--on-lead:#fff;--g1:rgba(82,88,255,.5);--g2:rgba(230,242,0,.15)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;
  background-image:radial-gradient(70% 45% at 85% 0%,var(--g1),transparent 70%),radial-gradient(50% 30% at 0% 100%,var(--g2),transparent 70%);
  background-attachment:fixed;min-height:100vh;transition:background-color .3s;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}
.logo{width:46px;height:46px;background:var(--lead);color:var(--on-lead);font-family:var(--display);font-weight:700;font-size:13px;line-height:.9;display:grid;place-items:center;box-shadow:3px 3px 0 var(--pop);text-transform:uppercase}
.share{width:48px;height:48px;border:2px solid var(--fg);background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.share svg{width:22px;height:22px}
.photo-wrap{position:relative;margin-top:10px}
.photo{width:130px;aspect-ratio:1;border:5px solid var(--lead);box-shadow:8px 8px 0 var(--pop);transform:rotate(-6deg);overflow:hidden;background:#222}
.photo canvas{width:100%;height:100%;display:block}
.sticker{position:absolute;top:-18px;right:-62px;background:var(--pop);color:#0b0b0c;font-family:var(--display);font-weight:700;font-size:26px;line-height:1;padding:6px 14px 2px;border-radius:999px;transform:rotate(8deg);border:2px solid #0b0b0c}
.kicker{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--pop);margin-bottom:-14px}
[data-skin="volt"] .kicker{color:var(--fg)}
.kicker b{color:var(--lead)}
[data-skin="volt"] .kicker b,[data-skin="lime"] .kicker b{color:var(--fg)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(68px,20vw,96px);line-height:.78;margin:0;text-transform:uppercase}
h1 span{display:block;color:var(--lead)}
[data-skin="volt"] h1 span{color:var(--fg)}
.bio{margin:0;color:var(--muted);font-size:16px;line-height:1.5;max-width:32ch}
.loc{font-size:13px;color:var(--muted);margin-top:-10px}
.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tags span{font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.14em;padding:4px 12px;border:2px solid var(--fg);border-radius:999px}
.tags .hot{background:var(--tag);color:var(--tag-fg);border-color:var(--tag)}
.links{width:100%;display:flex;flex-direction:column;gap:18px;margin-top:8px}
.btn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;background:var(--lead);color:var(--on-lead);
  font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.03em;line-height:1;padding:16px 20px 12px;text-transform:uppercase;text-align:left;
  box-shadow:7px 7px 0 var(--pop);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 var(--pop)}
.btn:active{transform:translate(5px,5px);box-shadow:2px 2px 0 var(--pop)}
.btn svg{width:20px;height:20px;flex:none;margin-top:-4px}
.socials{display:flex;gap:10px;margin-top:10px}
.socials a{width:48px;height:48px;border:2px solid var(--fg);color:var(--fg);display:grid;place-items:center;transition:background .15s,color .15s}
.socials a:hover{background:var(--fg);color:var(--bg)}
.socials svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sign{font-style:italic;color:var(--pop);font-size:17px;margin-top:12px}
[data-skin="volt"] .sign{color:var(--fg)}
.made{font-size:12px;color:var(--muted);margin-top:-14px}
.skins{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.skins button{font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;border:2px solid var(--fg);background:transparent;color:var(--fg);border-radius:999px;cursor:pointer}
.skins button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
:focus-visible{outline:3px solid var(--pop);outline-offset:3px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:700;padding:10px 16px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="logo" aria-label="The Design Square">डिज़<br>AIन</div>
    <button class="share" id="share" type="button" aria-label="Copy page link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></button>
  </div>

  <div class="photo-wrap">
    <div class="photo"><canvas id="ph" width="130" height="130" aria-hidden="true"></canvas></div>
    <div class="sticker">गपशप</div>
  </div>

  <div class="kicker">The <b>डिज़AIन</b> Square</div>
  <h1>Your<span>Name</span></h1>
  <p class="bio">Design. AI. Gupshup. Building small squares for real connections.</p>
  <div class="loc">◎ Delhi NCR</div>
  <div class="tags"><span>Design</span><span>AI</span><span class="hot">Gupshup</span></div>

  <nav class="links">
    <a class="btn" href="https://forms.gle/thedesignsquare-next" target="_blank" rel="noopener">Join the next Square<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg></a>
    <a class="btn" href="https://linkedin.com/posts/thedesignsquare" target="_blank" rel="noopener">AI हैंड्स-ऑन वर्कशॉप recap<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg></a>
    <a class="btn" href="https://linkedin.com/in/chetnagrover" target="_blank" rel="noopener">Read the founder story<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg></a>
    <a class="btn" href="https://thedesignsquare.in/partner" target="_blank" rel="noopener">Partner with us<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg></a>
  </nav>

  <div class="socials">
    <a href="https://instagram.com/thedesignsquare.in" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg></a>
    <a href="https://linkedin.com/in/yourname" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><path d="M6 10v8M6 6v.01M10 18v-8M10 13a3 3 0 0 1 6 0v5"/></svg></a>
    <a href="https://youtube.com/@thedesignsquare" target="_blank" rel="noopener" aria-label="YouTube"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/></svg></a>
    <a href="https://chat.whatsapp.com/the-square" target="_blank" rel="noopener" aria-label="WhatsApp community"><svg viewBox="0 0 24 24"><path d="M4 20l1.4-4A8 8 0 1 1 8 18.6z"/></svg></a>
    <a href="https://thedesignsquare.in" target="_blank" rel="noopener" aria-label="Website"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg></a>
  </div>

  <div class="sign">Sab kuch, ek Square mein.</div>
  <div class="made">Made with Link Adda</div>

  <div class="skins" role="group" aria-label="Theme">
    <button type="button" data-s="night">Neon Night</button>
    <button type="button" data-s="lime">Lime Lead</button>
    <button type="button" data-s="volt">Full-bleed Lime</button>
    <button type="button" data-s="blue">AI Blue</button>
  </div>
</div>
<div class="toast" id="toast" hidden>Link copied</div>

<script>
(function(){
  const root=document.documentElement, btns=[...document.querySelectorAll('.skins button')];
  const c=document.getElementById('ph'), x=c.getContext('2d');
  function paint(){
    const cs=getComputedStyle(root), a=cs.getPropertyValue('--lead').trim(), p=cs.getPropertyValue('--pop').trim();
    x.fillStyle='#1c1c20'; x.fillRect(0,0,130,130);
    // crowd of heads as a group-photo stand-in
    for(let r=0;r<4;r++)for(let i=0;i<6;i++){
      const cx=12+i*22+(r%2)*10, cy=30+r*26; x.fillStyle=['#c99a7a','#a8765a','#e0b494','#8a5c42'][(i+r)%4];
      x.beginPath(); x.arc(cx,cy,8,0,7); x.fill();
      x.fillStyle=[a,p,'#ddd','#333'][(i*3+r)%4]; x.fillRect(cx-10,cy+9,20,14);
    }
    const d=x.getImageData(0,0,130,130); for(let i=0;i<d.data.length;i+=4){const n=(Math.random()-.5)*30;d.data[i]+=n;d.data[i+1]+=n;d.data[i+2]+=n} x.putImageData(d,0,0);
  }
  function set(s){ if(s==='night') root.removeAttribute('data-skin'); else root.setAttribute('data-skin',s);
    btns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===s)); try{localStorage.setItem('skin',s)}catch(e){} paint(); }
  btns.forEach(b=>b.addEventListener('click',()=>set(b.dataset.s)));
  let s='night'; try{s=localStorage.getItem('skin')||'night'}catch(e){} set(s);
  const t=document.getElementById('toast');
  document.getElementById('share').addEventListener('click',()=>{
    const show=m=>{t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,1500)};
    try{navigator.clipboard.writeText(location.href).then(()=>show('Link copied'),()=>show('Copy the link from the address bar'))}catch(e){show('Copy the link from the address bar')}
  });
})();
</script>
</body>
</html>
